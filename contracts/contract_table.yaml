      "2": "Human explicitly acknowledges the risk of instruction injection when
             processing external content and flags the concern, but does not implement
             a mitigation strategy."
      "3": "Human implements a basic sandboxing protocol — separates data content
             from trusted instructions and directs the AI not to follow instructions
             found in processed external content."
