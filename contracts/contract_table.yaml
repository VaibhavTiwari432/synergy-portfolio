    # explicit redaction markers ([REDACTED], [NAME], [COMPANY], [EMAIL]),
    # paraphrasing indicating anonymization ("a company I work for", "a
    # colleague"), or privacy flags ("I'll anonymize this", "removing
    # identifying info", "not sharing names here").
