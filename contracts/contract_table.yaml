# Neuron Contract Table — Chat Classifier v2
# Schema: NeuronContract (chat_classifier/schemas.py §5.2)
# All 107 neurons (v6.0 FINAL). All 8 dimensions fully populated.
# Sources: ARI_Synergy_Framework_v2.md §4.4, ChatClassifier_v2_Implementation_Brief.md §5.2
#
# Field reference:
#   id               — stable identifier, e.g. "EC-01"
#   dimension        — parent dimension (AL/PR/EC/ES/CS/CD/AUI/CA)
#   type             — behavioral | metacognitive | structural
#   context_scope    — chunk | chat
#   extractor_type   — deterministic | embedding | llm_judge
#   micro_rubric     — for llm_judge neurons: {"0": anchor, "1": ..., "4": anchor}
#   detector         — for deterministic/embedding: expression or function ref
#   valence          — 1 (healthy synergy) or -1 (cognitive debt)
#   applicability_rule — condition under which the neuron fires
#   sector_universal — true (97-98 neurons) or false (rare exceptions)

# ── Governance (non-neuron metadata; does not add neurons/dimensions/pillars) ──

dif_governance:
  prohibition: >
    Reference classes in DIF testing MUST be education_stage, domain, ai_familiarity,
    language, task_type only. Occupation labels are PROHIBITED as reference classes —
    they encode socioeconomic confounds and cannot be cleared by standard DIF procedures.
    Violation requires CE sign-off and a new ADR before any DIF analysis.
  permitted_covariates: [education_stage, domain, ai_familiarity, language, task_type]
  prohibited_covariates: [occupation, employer, industry, income, job_title]
  authority: "non-negotiable #14 (fairness-safe covariates); spec §8.7"

# ── EC construct validity grounding (external evidence for Explanation Trap + D2 gate) ──
ec_construct_validity_grounding:
  - source: "Noorani et al. 2026 (multi-round Human-AI collaboration)"
    finding: >
      GT loss rate — humans who rely heavily on AI explanations show degraded independent
      performance on transfer tasks; effect size d≈0.68 in classroom contexts.
    relevance: >
      External construct validity for Explanation Trap (EC) and Fluent Incompetence gate (D2).
      GT loss rate is the behavioral signature this instrument's EC dimension is designed to
      measure. Rung: MEASURABLE (external replication). See PROPOSALS.md P-006 for the
      Noorani Tier-3 intervention proposal (deferred until instrument validated).

neurons:

  # ── EC — Error Correction & Epistemic Vigilance (chunk-scope) ──────────────
  # High-signal dimension for Skilled-Outsourcer detection (v2.0 §4.4).
  # EC neurons fire per 3-turn window; they capture whether the human
  # interrogates, challenges, or verifies AI outputs rather than accepting them.

  - id: EC-01
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human accepts the AI output without any form of challenge, verification,
             or independent check — no follow-up question, no counter-evidence cited."
      "1": "Human asks a minor clarifying question but does not test the AI's claim
             against external knowledge or constraints."
      "2": "Human poses a partial verification step (e.g., restates the claim and
             asks if it is correct) but does not introduce independent evidence."
      "3": "Human explicitly tests the AI output against an external constraint,
             prior knowledge, or an independent source; verifies correctness."
      "4": "Human provides a multi-step verification — cites counter-evidence or
             identifies a specific flaw — AND integrates the correction back into
             the conversation to improve the output."
    detector: null
    valence: 1
    applicability_rule: "AI produced a checkable, substantive claim or recommendation
                          in the preceding turn"
    sector_universal: true

  - id: EC-02
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human shows no awareness that AI-generated content may contain errors;
             accepts output at face value with no scrutiny."
      "1": "Human expresses vague doubt ('I'm not sure this is right') but does not
             act on it or follow up."
      "2": "Human explicitly flags uncertainty about the AI output and asks for
             clarification or an alternative."
      "3": "Human disagrees with or challenges a specific AI claim, citing why the
             claim seems incorrect or incomplete."
      "4": "Human identifies a specific hallucination, factual error, or logical
             inconsistency and explicitly corrects the record with supporting
             evidence or reasoning."
    detector: null
    valence: 1
    applicability_rule: "AI produced a factual claim or analytical statement in the
                          current or preceding chunk"
    sector_universal: true

  - id: EC-03
    dimension: EC
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human's subsequent contribution is a near-lexical copy of the AI output;
             no independent reasoning visible."
      "1": "Human rephrases the AI output with minor additions but no new reasoning."
      "2": "Human adds a small amount of new context or judgment but the AI output
             dominates the combined response."
      "3": "Human integrates AI output with a significant independent contribution
             (their own domain knowledge, criteria, or judgment)."
      "4": "Human's contribution clearly exceeds or materially transforms the AI
             output — the final text is substantially the human's, with AI as input."
    detector: null
    valence: 1
    applicability_rule: "AI produced substantive content (>50 tokens) and the human
                          has a subsequent turn in this chunk"
    sector_universal: true

  - id: EC-04
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human proceeds with or endorses the AI output on a high-stakes decision
             without any form of review or cross-check."
      "1": "Human notes that the decision is important but does not take an active
             verification step."
      "2": "Human asks the AI to double-check or reconsider one aspect of the
             high-stakes output."
      "3": "Human introduces an independent constraint (policy, domain rule, ethical
             criterion) to stress-test the AI's recommendation."
      "4": "Human applies a multi-axis review — verifies factual accuracy, checks
             against real-world constraints, and retains explicit decision authority
             rather than delegating the final call."
    detector: null
    valence: 1
    applicability_rule: "The chunk involves a high-stakes decision, recommendation,
                          or action (medical, legal, financial, safety-critical, or
                          explicitly flagged as consequential by the human)"
    sector_universal: true

  - id: EC-05
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human does not use available explanation affordances; accepts a confident
             AI claim without requesting justification."
      "1": "Human requests a brief explanation but does not follow up when the
             explanation is incomplete or circular."
      "2": "Human requests an explanation and partially evaluates it, but does not
             test whether the reasoning is sound."
      "3": "Human requests an explanation AND evaluates whether the reasoning is
             valid — pushes back if the justification is weak."
      "4": "Human drives a multi-turn explanation chain: asks for justification,
             challenges weak links, and only accepts the claim once the chain
             is logically sound."
    detector: null
    valence: 1
    applicability_rule: "AI delivered a confident assertion on a non-trivial topic
                          where explanation affordances were available (AI could have
                          been asked to justify the claim)"
    sector_universal: true

  - id: EC-06
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: deterministic
    micro_rubric: null
    detector: "count_verification_markers"
    # Counts explicit verification markers: words/phrases such as
    # "is that correct", "let me verify", "actually", "that's wrong",
    # "I checked", "source:", "citation", "double-check", "confirm",
    # "wait — ", "that doesn't seem right" in the human turn(s) of the chunk.
    valence: 1
    applicability_rule: "The chunk contains at least one human turn"
    sector_universal: true

  - id: EC-07
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: deterministic
    micro_rubric: null
    detector: "interrogative_to_affirmative_ratio"
    # Ratio of question-mark-ending sentences to affirmative sentences in
    # human turns of the chunk. High ratio → active interrogation of AI output.
    valence: 1
    applicability_rule: "The chunk contains at least one human turn with ≥2 sentences"
    sector_universal: true

  - id: EC-08
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human delegates subjective value judgment entirely to AI without
             retaining any human evaluative stance."
      "1": "Human accepts AI's framing of the value dimension but adds a minor
             personal note."
      "2": "Human partially contests the AI's value framing with their own
             perspective."
      "3": "Human clearly maintains an independent evaluative position that differs
             from or extends the AI's framing."
      "4": "Human explicitly uses the AI's analysis as raw material, then applies
             their own ethical/value framework and retains decision authority."
    detector: null
    valence: 1
    applicability_rule: "The chunk involves a subjective, value-laden, or ethical
                          judgment (aesthetics, ethics, policy preference, priorities)"
    sector_universal: true

  - id: EC-09
    dimension: EC
    type: structural
    context_scope: chunk
    extractor_type: deterministic
    micro_rubric: null
    detector: "unverified_confident_claim_flag"
    # Fires (ordinal=0, valence=-1) when: AI produced a confident statement
    # (hedging score below threshold: no "I think", "might", "uncertain",
    # "approximately" — relies on count_hedging_markers returning 0) AND
    # the human's subsequent turn shows zero verification markers
    # (count_verification_markers == 0).
    # This is the "blind acceptance" signal from the v2.0 §4.4 sample row.
    valence: -1
    applicability_rule: "AI turn in chunk has hedging_score = 0 (highly confident)
                          AND human turn has verification_markers = 0"
    sector_universal: true

  - id: EC-10
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human has made multiple subsequent turns with no self-correction or
             acknowledgment of error; no evidence of epistemic updating."
      "1": "Human implicitly shifts position in a later turn without acknowledging
             the earlier error."
      "2": "Human partially corrects an earlier mistake when prompted by the AI."
      "3": "Human spontaneously notices and corrects their own prior error,
             updating their working model."
      "4": "Human proactively identifies their own mistake, explains why it was
             wrong, and integrates the correction to improve the conversation."
    detector: null
    valence: 1
    applicability_rule: "Human made a factually or logically questionable claim in
                          an earlier turn in this chunk or adjacent chunk"
    sector_universal: true

  - id: EC-11
    dimension: EC
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human treats the AI's confidence level as a reliable signal of
             correctness; does not apply asymmetric skepticism."
      "1": "Human occasionally questions a confident AI claim but inconsistently."
      "2": "Human actively questions AI confidence on most high-confidence claims."
      "3": "Human routinely identifies when the AI is confidently wrong and
             applies appropriate skepticism proportional to stakes."
      "4": "Human demonstrates calibrated asymmetric skepticism: more scrutiny on
             high-confidence AI claims on high-stakes topics; uses their own domain
             knowledge as an independent check."
    detector: null
    valence: 1
    applicability_rule: "AI produced multiple confident claims across the chunk; at
                          least one claim was on a high-stakes or verifiable topic"
    sector_universal: true

  # ── PR — Prompt Reasoning (chunk-scope) ────────────────────────────────────
  # PR measures how well the human structures, scaffolds, and iteratively
  # refines their prompts to elicit higher-quality AI contributions.

  - id: PR-01
    dimension: PR
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human provides a vague or underspecified request with no context,
             constraints, or success criteria."
      "1": "Human provides a bare request with minimal context; no constraints
             or output criteria stated."
      "2": "Human provides context and a partial constraint but no explicit
             success criteria or output format."
      "3": "Human provides clear context, at least one constraint, and a partial
             definition of desired output quality."
      "4": "Human provides rich context, explicit constraints, concrete examples
             or analogies, and clear success criteria — fully scaffolded prompt."
    detector: null
    valence: 1
    applicability_rule: "The chunk contains a human prompt that initiates or
                          continues a substantive task request"
    sector_universal: true

  - id: PR-02
    dimension: PR
    type: behavioral
    context_scope: chunk
    extractor_type: deterministic
    micro_rubric: null
    detector: "constraint_and_example_presence"
    # Scores presence of structural prompt quality markers in human turns:
    # explicit constraints ("must", "should not", "limited to"),
    # examples ("for example", "like", "such as", "e.g."),
    # success criteria ("goal is", "I need the output to", "should look like").
    valence: 1
    applicability_rule: "The chunk contains at least one human prompt turn"
    sector_universal: true

  - id: PR-03
    dimension: PR
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human makes no attempt to refine or improve the prompt after an
             unsatisfactory AI response."
      "1": "Human re-asks essentially the same prompt with minor word changes."
      "2": "Human reformulates the prompt with one significant change (more
             context or a new constraint)."
      "3": "Human clearly diagnoses why the prior response was insufficient and
             reformulates to address that specific gap."
      "4": "Human runs an explicit iterative refinement loop: diagnoses the gap,
             reformulates with targeted improvements, and evaluates whether the
             new response is better."
    detector: null
    valence: 1
    applicability_rule: "The AI's previous turn was suboptimal or incomplete AND
                          the human had an opportunity to reformulate"
    sector_universal: true

  - id: PR-04
    dimension: PR
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human issues a bare extractive command with no reasoning or rationale
             shared ('write this', 'finish this', 'do this')."
      "1": "Human provides a minimal rationale but no reasoning chain."
      "2": "Human shares partial reasoning that helps the AI understand the goal
             behind the request."
      "3": "Human explicitly shares their own reasoning or mental model and asks
             the AI to build on or challenge it."
      "4": "Human co-reasons with the AI — shares their current hypothesis,
             asks the AI to find flaws or alternatives, and then integrates
             the AI's reasoning with their own."
    detector: null
    valence: 1
    applicability_rule: "The chunk contains a substantive task request from the human"
    sector_universal: true

  - id: PR-05
    dimension: PR
    type: structural
    context_scope: chunk
    extractor_type: deterministic
    micro_rubric: null
    detector: "generative_vs_extractive_ratio"
    # Ratio of generative prompts (contain interrogation verbs: "explain",
    # "what are the alternatives", "find the flaw", "critique", "compare",
    # "why", "how could") to extractive commands ("write", "generate",
    # "list", "summarize", "finish", "complete") in human turns.
    valence: 1
    applicability_rule: "The chunk contains at least two human prompt turns"
    sector_universal: true

  # ── AL — AI Literacy (chunk/chat-scope) ────────────────────────────────────
  # AL captures the human's accurate understanding of AI mechanisms, limitations,
  # and operational boundaries — the foundational literacy that prevents
  # fluent incompetence rooted in over-trust of AI fluency.

  - id: AL-01
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human equates AI fluency with factual accuracy; accepts confidently
             phrased output as true without questioning whether linguistic confidence
             reflects factual reliability."
      "1": "Human occasionally questions confident AI claims but primarily relies on
             fluency as a reliability proxy."
      "2": "Human shows awareness that AI confidence does not equal accuracy but
             applies this inconsistently across the chunk."
      "3": "Human routinely treats AI linguistic confidence as independent from
             factual accuracy; verifies claims based on content domain rather than
             assertion style."
      "4": "Human explicitly and consistently decouples AI fluency from factual
             reliability; applies calibrated independent verification proportional to
             domain stakes, not to AI's assertion style."
    detector: null
    valence: 1
    applicability_rule: "AI has produced a confident-sounding assertion on a
                          verifiable topic where the human had an opportunity to
                          evaluate reliability independently of fluency"
    sector_universal: true

  - id: AL-02
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human attributes AI responses to genuine reasoning or understanding;
             treats AI as a cognitive agent with intentions or true beliefs rather
             than a statistical pattern-completion system."
      "1": "Human occasionally acknowledges AI as a statistical system but reverts
             to reasoning-attribution in practice within the chunk."
      "2": "Human understands that AI uses statistical pattern completion but does
             not consistently apply this understanding when interpreting AI outputs."
      "3": "Human clearly understands that AI derives answers via pattern completion,
             not logical deduction, and applies this understanding when evaluating
             AI output reliability."
      "4": "Human explicitly reasons from AI's statistical nature to predict its
             failure modes, interpret confidence patterns, and calibrate expectations
             before output is generated — treating the mechanism as a first-class
             consideration."
    detector: null
    valence: 1
    applicability_rule: "Human is interpreting AI reasoning or attributing the source
                          of an AI claim within the chunk"
    sector_universal: true

  - id: AL-03
    dimension: AL
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human makes no attempt to re-anchor critical context across a long
             conversation; assumes AI retains all prior information accurately."
      "1": "Human occasionally re-mentions a key point but does not systematically
             monitor for AI context loss."
      "2": "Human proactively summarizes or re-anchors context at least once after
             noticing a potential memory loss."
      "3": "Human tracks conversation length, anticipates where context degradation
             may occur, and proactively re-injects critical information before it
             affects output."
      "4": "Human maintains an explicit mental model of the AI's effective context
             window, systematically re-anchors critical constraints at risk of
             displacement, and verifies context retention before proceeding on
             memory-dependent tasks."
    detector: null
    valence: 1
    applicability_rule: "The conversation exceeds a few turns or involves context
                          established early that is critical to the current task"
    sector_universal: true

  - id: AL-04
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human provides complex nested, conditional, or recursive instructions
             without anticipating any structural failure point."
      "1": "Human notices a structural failure after it occurs but did not predict
             it before submitting the prompt."
      "2": "Human anticipates one likely structural failure point and preemptively
             simplifies or flags it before submission."
      "3": "Human proactively identifies where the AI is likely to break on complex
             formatting, deep conditionality, or recursive logic, and restructures
             the request to prevent failure."
      "4": "Human performs a structural brittleness audit before delegating: maps
             all nested, conditional, or recursive elements; identifies each likely
             failure point; and preemptively restructures, stages, or disambiguates
             to ensure reliable execution."
    detector: null
    valence: 1
    applicability_rule: "The task involves nested data structures, complex formatting
                          requirements, deep conditionality, or recursive logic"
    sector_universal: true

  - id: AL-05
    dimension: AL
    type: behavioral
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human delegates a specialized or sensitive task with no domain context
             or custom parameters; relies entirely on AI's default training
             distribution."
      "1": "Human provides a general domain label but no specific constraints,
             terminology conventions, or domain-specific parameters."
      "2": "Human establishes partial domain context (e.g., area of expertise) but
             does not define the specific knowledge environment needed."
      "3": "Human explicitly grounds the AI in the relevant domain — establishing
             terminology conventions, key constraints, and domain-specific parameters
             before task execution."
      "4": "Human constructs a complete domain environment: defines all relevant
             domain-specific terminology, constraints, and knowledge anchors; verifies
             the AI has adopted this environment before proceeding."
    detector: null
    valence: 1
    applicability_rule: "The task is specialized or domain-sensitive, requiring
                          domain-specific knowledge or conventions to execute correctly"
    sector_universal: true

  - id: AL-06
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human treats AI output as deterministic; assumes identical prompts will
             always yield the same result and does not plan for output variance."
      "1": "Human occasionally reruns a prompt but treats variance as error rather
             than expected stochastic behavior."
      "2": "Human acknowledges that AI outputs can vary but does not factor this into
             task design or verification strategy."
      "3": "Human demonstrates probabilistic expectations of AI behavior — plans for
             output variance, samples multiple outputs, or applies variance-reduction
             strategies when consistency is required."
      "4": "Human explicitly reasons about AI output variance in task design:
             identifies where variance is acceptable and where it is not, applies
             appropriate sampling or constraint strategies to manage it, and tests
             output stability before committing to a decision."
    detector: null
    valence: 1
    applicability_rule: "The task requires reliable, consistent AI output across
                          invocations or the human is using a single AI response
                          to make a downstream decision"
    sector_universal: true

  - id: AL-07
    dimension: AL
    type: metacognitive
    context_scope: chat
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human treats the AI as uniformly capable across all task types; shows
             no awareness of model-specific capability degradation zones."
      "1": "Human discovers one capability failure reactively but does not generalize
             to a model of the AI's capability profile."
      "2": "Human demonstrates awareness of a few specific capability limits but
             treats these as isolated anomalies rather than systematic patterns."
      "3": "Human maintains an active mental map of the AI's reliable capability
             zones versus characteristic degradation areas, and structures task
             delegation accordingly."
      "4": "Human operates with a detailed, continuously updated capability map:
             proactively routes tasks to AI only in zones of reliable performance,
             redirects or scaffolds tasks in known degradation zones, and updates
             the map as new failure evidence emerges."
    detector: null
    valence: 1
    applicability_rule: "The chat spans multiple task types or the human is making
                          delegation decisions about what to send to AI"
    sector_universal: true

  - id: AL-08
    dimension: AL
    type: behavioral
    context_scope: chunk
    extractor_type: deterministic
    micro_rubric: null
    detector: "temporal_claim_flag_present"
    # Detects whether the human explicitly flags a temporally sensitive AI claim
    # for independent verification. Triggers on human turn phrases such as:
    # "knowledge cutoff", "as of [date]", "that may be outdated", "verify this
    # is current", "post-training", "check the date on this", "your training may
    # not include", "need to verify this is still true".
    valence: 1
    applicability_rule: "AI has made a claim involving time-indexed information,
                          current events, recent research, or rapidly evolving data"
    sector_universal: true

  - id: AL-09
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human assigns tasks to AI without evaluating whether the model's
             architecture and training are appropriate for the specific task."
      "1": "Human occasionally wonders if AI is the right tool but does not conduct
             a systematic fit assessment."
      "2": "Human identifies that the current AI may be suboptimal for the task but
             proceeds without mitigation."
      "3": "Human explicitly evaluates whether the AI model is a good fit for the
             task and adjusts task framing or model choice accordingly."
      "4": "Human performs a systematic model-task fit assessment — evaluates the
             model's architecture, training modality, and known capability profile
             against the task's specific requirements, and makes an evidence-based
             delegation decision."
    detector: null
    valence: 1
    applicability_rule: "The task requires specialized AI capability and there are
                          alternative approaches or tools available"
    sector_universal: true

  - id: AL-10
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human does not model what information the AI has access to in the current
             context; is surprised by AI failures caused by missing context."
      "1": "Human occasionally wonders what the AI 'knows' but does not systematically
             reason about its epistemic state."
      "2": "Human considers what context the AI has been given and makes some
             adjustments, but misses key epistemic blind spots."
      "3": "Human maintains an explicit model of what the AI does and does not have
             access to in the current context window, and uses this to predict likely
             failure modes before they occur."
      "4": "Human precisely simulates the AI's epistemic state: inventories what
             information has been provided, what has been omitted, and what the AI
             cannot access from training — proactively addressing gaps before they
             produce errors."
    detector: null
    valence: 1
    applicability_rule: "The task depends on specific contextual information that
                          may or may not be in the AI's current context window"
    sector_universal: true

  - id: AL-11
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human assumes uniform AI reliability across modalities; applies the
             same trust level to image, code, audio, and text outputs without
             modality-specific calibration."
      "1": "Human notices a modality-specific failure reactively but does not adjust
             verification depth by modality going forward."
      "2": "Human shows awareness that AI reliability varies by modality but applies
             inconsistent verification adjustment."
      "3": "Human demonstrates calibrated modality-specific trust — applies
             proportionally deeper verification to modalities where AI is known to
             have lower reliability."
      "4": "Human explicitly reasons about modality-specific reliability profiles
             before delegating, applies proportionally adjusted verification depth
             for each modality type, and flags high-risk modality combinations for
             additional scrutiny."
    detector: null
    valence: 1
    applicability_rule: "The task involves multiple modalities or a non-text modality
                          such as images, code, audio, or structured data"
    sector_universal: true

  - id: AL-12
    dimension: AL
    type: metacognitive
    context_scope: chunk
    extractor_type: llm_judge
    micro_rubric:
      "0": "Human cannot distinguish AI refusals or constraint-induced behavior from
             genuine capability failure; attributes all constraint-driven responses
             to incompetence."
      "1": "Human suspects system-level constraints are influencing AI behavior but
             cannot identify the specific constraint type."
      "2": "Human correctly identifies one category of system constraint (e.g., safety
             filter, system prompt) affecting the current interaction."
      "3": "Human demonstrates working knowledge of the main AI behavioral constraint
             layers — system prompts, safety filters, alignment fine-tuning — and uses
             this to distinguish constraint-caused behavior from genuine capability
             limits."
      "4": "Human explicitly models the AI's constraint architecture for the current
             deployment context, correctly distinguishes refusals from capability
             limits, and adapts their interaction strategy to work productively within
             identified constraints."
    detector: null
    valence: 1
    applicability_rule: "The AI exhibits refusal, constrained behavior, or unexpected
