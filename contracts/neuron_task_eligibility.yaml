# neuron_task_eligibility.yaml — ADR-0019 pre-filter eligibility matrix
#
# STATUS: CRITIC-REFINED (v1.1.0). Merged and optimized.
# Aligned to mitigate cognitive debt, prevent pass-through vulnerabilities,
# and optimize signal capture for real-time work distribution auditing.
version: "1.1.0-critic-refined"
intent_tags: [VERIFY, EXTRACT, INJECT_CONTEXT, OVERRIDE, SELF_AUDIT, DELEGATE, SCAFFOLD, PIVOT, DECOMPOSE, ACCEPT_FLAT]

